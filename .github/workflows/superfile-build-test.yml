name: Go CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup dependencies (only on linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y exiftool zoxide

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ${{ runner.temp }}/gomodcache
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache

      - name: Build
        run: go build -v ./...
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache

      - name: Test
        # Shell-startup tests have strict deadlines; avoid competing packages
        # spawning PowerShell at once on shared Windows runners.
        run: go test -p=1 -v ./...
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache

      - name: Test extraction boundary fork
        # Nested-module tests are excluded by ./...; use the main module's
        # selected dependencies and run these explicitly on every native OS.
        run: go test -p=1 -v golift.io/xtractr
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache

      - name: Check gofmt (skip on Windows)
        if: runner.os != 'Windows'
        run: |
          go fmt ./...
          git diff --exit-code

      - name: golangci-lint (skip on Windows)
        if: runner.os != 'Windows'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout 3m
