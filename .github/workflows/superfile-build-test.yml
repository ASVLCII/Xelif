name: Go CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup dependencies (only on linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y exiftool zoxide

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ${{ runner.temp }}/gomodcache
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache

      - name: Build
        run: go build -v ./...
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache

      - name: Warm Windows shell runtime
        if: runner.os == 'Windows'
        timeout-minutes: 2
        # The prompt suite deliberately retains short command deadlines. Prime
        # Windows PowerShell/.NET startup before exercising those deadlines on
        # a cold hosted image; do not relax assertions or change user shells.
        run: powershell.exe -NoLogo -NonInteractive -Command "Write-Output 'Xelif shell runtime ready'"

      - name: Test
        # Shell-startup tests have strict deadlines; avoid competing packages
        # spawning PowerShell at once on shared Windows runners.
        run: go test -p=1 -v ./...
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache

      - name: Test extraction boundary fork
        # Nested-module tests are excluded by ./...; use the main module's
        # selected dependencies and run these explicitly on every native OS.
        run: go test -p=1 -v golift.io/xtractr
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache

      - name: Race detector (native runtime)
        run: go test -race -short -p=1 -count=1 -timeout=10m ./...
        env:
          CGO_ENABLED: '1'
          GOMODCACHE: ${{ runner.temp }}/gomodcache

      - name: Task, workspace and operation regressions (repeat under race detector)
        run: >-
          go test -race -short -p=1 -count=20 -timeout=10m
          -run '^Test(Task|Operation|AsyncPreviewPanelSync|Workspace|NamedWorkspace|FinalWorkspace|DirectoryCopy|NewDirectoryPreview|MetadataCompletion|MetadataOperation|MetadataSuperseded|PluginCompletion)'
          ./src/internal ./src/internal/ui/processbar
        env:
          CGO_ENABLED: '1'
          GOMODCACHE: ${{ runner.temp }}/gomodcache

      - name: Race detector for extraction boundary fork
        run: go test -race -p=1 -count=1 -timeout=5m golift.io/xtractr
        env:
          CGO_ENABLED: '1'
          GOMODCACHE: ${{ runner.temp }}/gomodcache

      - name: Check gofmt (skip on Windows)
        if: runner.os != 'Windows'
        run: |
          go fmt ./...
          git diff --exit-code

      - name: golangci-lint (skip on Windows)
        if: runner.os != 'Windows'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout 10m
