name: Python Testsuite Run

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build superfile
        run: ./build.sh

      # Keep this non-mutating: killing fresh setup leaves an unconfirmed profile.
      # Workflow cases provide an explicit valid config and legacy keymap.
      - name: Check installation
        run: tmux -V && bin/spf doctor --json
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xelif-tests/config
          XDG_DATA_HOME: ${{ runner.temp }}/xelif-tests/data
          XDG_STATE_HOME: ${{ runner.temp }}/xelif-tests/state
          XDG_CACHE_HOME: ${{ runner.temp }}/xelif-tests/cache

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
    
      - name: Install Dependencies
        run: pip install -r testsuite/requirements.txt

      - name: Test tmux harness
        working-directory: testsuite
        timeout-minutes: 2
        run: python -m unittest discover -s unit -v

      - name: Run Tests
        run: python testsuite/main.py -d
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xelif-tests/config
          XDG_DATA_HOME: ${{ runner.temp }}/xelif-tests/data
          XDG_STATE_HOME: ${{ runner.temp }}/xelif-tests/state
          XDG_CACHE_HOME: ${{ runner.temp }}/xelif-tests/cache
      
      - name: Print logs
        if: always()
        run: if [ -f "$XDG_STATE_HOME/xelif/xelif.log" ]; then cat "$XDG_STATE_HOME/xelif/xelif.log"; fi
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/xelif-tests/state
