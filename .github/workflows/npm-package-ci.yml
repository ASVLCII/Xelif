name: npm package checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: win32, arch: x64 }
          - { runner: windows-11-arm, platform: win32, arch: arm64 }
          - { runner: ubuntu-24.04, platform: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { runner: macos-15-intel, platform: darwin, arch: x64 }
          - { runner: macos-15, platform: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify native runtime target
        run: node -e "if (process.platform !== '${{ matrix.platform }}' || process.arch !== '${{ matrix.arch }}') process.exit(1)"
      - name: Test launcher boundaries
        run: node --test --test-timeout=120000 packaging/npm/test/launcher.test.cjs
      - name: Build native executable and package manifests
        run: node packaging/npm/build.mjs "${{ runner.temp }}/xelif-stage"
      - name: Install packed packages with npm and Bun
        run: node packaging/npm/pack-smoke.mjs "${{ runner.temp }}/xelif-stage" "${{ runner.temp }}/xelif-smoke"
      - name: Upload native npm tarball and smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/xelif-smoke/packs/asvlcii-xelif-${{ matrix.platform }}-${{ matrix.arch }}-*.tgz
            ${{ runner.temp }}/xelif-smoke/results.json
          if-no-files-found: error
      - name: Upload the shared launcher tarball
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: npm-launcher
          path: ${{ runner.temp }}/xelif-smoke/packs/asvlcii-xelif-0*.tgz
          if-no-files-found: error
